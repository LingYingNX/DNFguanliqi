name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Electron binary
        run: pnpm exec install-electron

      - name: Verify tag version
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tagVersion -ne $packageVersion) {
            throw "Git tag $tagVersion does not match package.json version $packageVersion"
          }

      - name: Build and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run release

      - name: Verify latest release pointer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $expected = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          $selfDraft = gh api "repos/$repo/releases/tags/$expected" --jq .draft 2>$null
          if ($selfDraft -eq "true") {
            Write-Output "::warning::electron-builder left release $expected as a DRAFT. Publish it manually with release notes and -F make_latest=true; electron-updater clients cannot see drafts."
            exit 0
          }
          $retries = 6
          for ($i = 1; $i -le $retries; $i++) {
            Start-Sleep -Seconds 5
            $latest = gh api "repos/$repo/releases/latest" --jq .tag_name 2>$null
            if ($latest -eq $expected) {
              Write-Output "Latest release points to $latest"
              exit 0
            }
            Write-Output "Attempt ${i}: latest is '$latest', expected '$expected'"
          }
          throw "releases/latest points to '$latest' instead of '$expected'. electron-updater clients will not see the new version. Fix with: gh api -X PATCH repos/$repo/releases/<release-id> -F make_latest=true"
